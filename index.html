<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" >

    <title>SEO Explorer </title>
    <link

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <link rel="stylesheet" href="/css/boostrap-global.css" >

  </head>

  <body>
    <div id="app" >
      <header>
        <div

        >
          <h1 class="mb-0 fs-6 fs-sm-4 fs-md-3 text-nowrap">🟧 SEO EXPLORER</h1>
          <nav

            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <router-link to="/" class="nav-link texte-orange px-1 px-sm-2"

              <li class="nav-item">
                <router-link

                <router-link
                  to="/analisi"
                  class="nav-link texte-orange px-1 px-sm-2"

              </li>
              <li class="nav-item">
                <router-link
                  to="/workspace"
                  class="nav-link texte-orange px-1 px-sm-2"

              </li>
            </ul>
          </nav>
        </div>

        <div class="container-fluid px-0">
          <img
            src="img/font.png"
            alt="SEO image keyword"
            class="img-fluid w-100 banner-tagliato"

        </div>
      </header>

      <main>
        <router-view></router-view>

      <footer class="bg-orange texte-blue d-flex justify-content-center align-items-center py-4" >
        <p class="m-0">&copy; SEO EXPLORER - A.A 2025/2026</p>
      </footer>

    <script src="main.js"></script>
